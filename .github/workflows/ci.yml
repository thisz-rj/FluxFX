name: CI

# `checks`: everything that runs without Blender. `headless-blender`: the real
# GPU solver, bake, cache, invalid-value guard and VDB/render pipeline inside
# Blender-as-a-module on Mesa llvmpipe (OpenGL). Metal/Apple GPU validation
# stays manual on Apple Silicon (see FluxFX_Source/README.md).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Python ${{ matrix.python }}${{ matrix.numpy && ' + NumPy' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            numpy: false
          - python: "3.13"
            numpy: false
          - python: "3.13"   # Blender 5.3 bundles Python 3.13 and NumPy
            numpy: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install NumPy
        if: matrix.numpy
        run: python -m pip install --disable-pip-version-check numpy
      - name: Compile, unit tests, provenance, native CPU tests
        run: python FluxFX_Source/scripts/ci_checks.py

  headless-blender:
    name: Headless Blender (bpy 5.2.2, llvmpipe)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"   # the bpy wheel requires exactly 3.13
      - name: Install Mesa EGL and X client libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libegl-mesa0 libgl1-mesa-dri libgles2 libgbm1 \
            libgl1 libx11-6 libxext6 libxrender1 libxfixes3 libxi6 libxkbcommon0 libsm6 libice6
      - name: Install Blender as a Python module
        run: python -m pip install --disable-pip-version-check bpy==5.2.2
      - name: GPU bake, cache, guard, VDB export, Cycles and EEVEE renders
        env:
          EGL_PLATFORM: surfaceless
        run: >
          python FluxFX_Source/scripts/headless_validate.py
          --output headless-report.json --workdir headless-work
      - name: Keep report and renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-blender
          path: |
            headless-report.json
            headless-work/**/*.png
          if-no-files-found: ignore
